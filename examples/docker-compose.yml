services:
  portal:
    build:
      context: ..
      dockerfile: examples/portal/Dockerfile
    restart: unless-stopped

  react:
    build:
      context: ..
      dockerfile: examples/react/Dockerfile
      args:
        VITE_AUTHON_PUBLISHABLE_KEY: ${VITE_AUTHON_PUBLISHABLE_KEY}
        VITE_AUTHON_API_URL: ${VITE_AUTHON_API_URL}
    restart: unless-stopped

  nextjs:
    build:
      context: ..
      dockerfile: examples/nextjs/Dockerfile
      args:
        NEXT_PUBLIC_AUTHON_PUBLISHABLE_KEY: ${NEXT_PUBLIC_AUTHON_PUBLISHABLE_KEY}
        NEXT_PUBLIC_AUTHON_API_URL: ${NEXT_PUBLIC_AUTHON_API_URL}
    env_file: .env
    restart: unless-stopped

  vue:
    build:
      context: ..
      dockerfile: examples/vue/Dockerfile
      args:
        VITE_AUTHON_PUBLISHABLE_KEY: ${VITE_AUTHON_PUBLISHABLE_KEY}
        VITE_AUTHON_API_URL: ${VITE_AUTHON_API_URL}
    restart: unless-stopped

  nuxt:
    build:
      context: ..
      dockerfile: examples/nuxt/Dockerfile
    env_file: .env
    restart: unless-stopped

  angular:
    build:
      context: ..
      dockerfile: examples/angular/Dockerfile
      args:
        AUTHON_PUBLISHABLE_KEY: ${AUTHON_PUBLISHABLE_KEY}
        AUTHON_API_URL: ${AUTHON_API_URL}
    restart: unless-stopped

  svelte:
    build:
      context: ..
      dockerfile: examples/svelte/Dockerfile
    env_file: .env
    environment:
      - ORIGIN=${SVELTE_ORIGIN:-http://192.168.0.200:15596}
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
    restart: unless-stopped

  vanilla-js:
    build:
      context: ..
      dockerfile: examples/vanilla-js/Dockerfile
      args:
        VITE_AUTHON_PUBLISHABLE_KEY: ${VITE_AUTHON_PUBLISHABLE_KEY}
        VITE_AUTHON_API_URL: ${VITE_AUTHON_API_URL}
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    ports:
      - "15585:80"
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - portal
      - react
      - nextjs
      - vue
      - nuxt
      - angular
      - svelte
      - vanilla-js
    restart: unless-stopped
