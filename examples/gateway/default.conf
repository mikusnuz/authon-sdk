# examples.authon.dev 단일 진입점.
# server-4 리버스프록시는 이 컨테이너 하나(15585)만 바라보고,
# 프레임워크별 분기는 여기서 도커 네트워크 내부로 처리한다.
server {
  listen 80;
  server_name _;

  location /react/   { proxy_pass http://react:80/; }
  location /nextjs   { proxy_pass http://nextjs:3000; }
  location /vue/     { proxy_pass http://vue:80/; }
  location /nuxt/    { proxy_pass http://nuxt:3000; }
  location /angular/ { proxy_pass http://angular:80/; }
  location /svelte/  { proxy_pass http://svelte:3000; }
  location /js/      { proxy_pass http://vanilla-js:80/; }
  location /         { proxy_pass http://portal:80; }
}
